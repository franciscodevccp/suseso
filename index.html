<!doctype html>
<html lang="es-CL">
  <head>
    <script>
      // Aplica el tema (claro/oscuro) antes del primer pintado, para
      // evitar el parpadeo de cambiar de tema recién cuando React monta.
      // Misma lógica de resolución que src/features/theme/context/ThemeContext.jsx
      // (deben mantenerse en sync: no puede importarse un módulo aquí).
      (function () {
        try {
          var preferencia = localStorage.getItem('sisga_tema') || 'automatico';
          var prefiereOscuroSO = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var esOscuro = preferencia === 'oscuro' || (preferencia === 'automatico' && prefiereOscuroSO);
          document.documentElement.setAttribute('data-tema', esOscuro ? 'oscuro' : 'claro');
        } catch (error) {
          // localStorage puede fallar (modo privado, etc.): se queda con el claro por defecto.
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SISGA · Acceso | SUSESO</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
